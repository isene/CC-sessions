<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="#0a0e27"/>

  <!-- Terminal frame -->
  <rect x="25" y="35" width="150" height="115" rx="8" fill="#1a1e37" stroke="#444" stroke-width="2"/>

  <!-- Terminal title bar -->
  <rect x="25" y="35" width="150" height="20" rx="8" fill="#2a2e47"/>
  <rect x="25" y="47" width="150" height="8" fill="#2a2e47"/>

  <!-- Terminal buttons -->
  <circle cx="40" cy="45" r="5" fill="#ff5f56"/>
  <circle cx="55" cy="45" r="5" fill="#ffbd2e"/>
  <circle cx="70" cy="45" r="5" fill="#27ca40"/>

  <!-- Command prompt -->
  <g font-family="monospace" font-size="11" fill="#00ff00">
    <text x="35" y="75">$ cc rtfm</text>
    <text x="35" y="90" fill="#888">Resuming session...</text>
  </g>

  <!-- Bookmark icon (center) -->
  <g transform="translate(100, 115)">
    <!-- Bookmark shape with Claude orange -->
    <path d="M -15,-20 L -15,20 L 0,10 L 15,20 L 15,-20 Z"
          fill="#d97706" stroke="#f59e0b" stroke-width="2">
      <animate attributeName="fill" values="#d97706;#f59e0b;#d97706" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- Tag icon inside bookmark -->
    <g transform="translate(0, -5)" fill="none" stroke="#fff" stroke-width="1.5">
      <circle cx="-3" cy="-3" r="2" fill="#fff"/>
      <path d="M -6,0 L 0,6 L 6,0 L 0,-6 Z"/>
    </g>
  </g>

  <!-- Floating tags -->
  <g font-family="monospace" font-size="8" fill="#f59e0b">
    <rect x="130" y="70" width="35" height="12" rx="3" fill="#2a2e47" stroke="#f59e0b" stroke-width="1"/>
    <text x="147" y="79" text-anchor="middle">#ruby</text>

    <rect x="130" y="85" width="35" height="12" rx="3" fill="#2a2e47" stroke="#f59e0b" stroke-width="1"/>
    <text x="147" y="94" text-anchor="middle">#vim</text>

    <rect x="130" y="100" width="35" height="12" rx="3" fill="#2a2e47" stroke="#f59e0b" stroke-width="1"/>
    <text x="147" y="109" text-anchor="middle">#i3</text>
  </g>

  <!-- Pulsing effect around bookmark -->
  <circle cx="100" cy="115" r="25" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0">
    <animate attributeName="r" values="25;35;25" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Ruby logo (small) -->
  <g transform="translate(170, 35) scale(0.12)">
    <path fill="#D91404" d="M35.971 111.33c27.466 3.75 54.444 7.433 81.958 11.188-9.374-15.606-18.507-30.813-27.713-46.144l-54.245 34.956zM125.681 24.947c-2.421 3.636-4.847 7.269-7.265 10.907-8.304 12.493-16.607 24.986-24.903 37.485-.462.696-1.061 1.248-.41 2.321 8.016 13.237 15.969 26.513 23.942 39.777 1.258 2.095 2.53 4.182 4.157 6.192 1.612-32.193 3.223-64.387 4.834-96.58l-.355-.102z"/>
  </g>

  <!-- Text -->
  <text x="100" y="170" font-family="monospace" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">CC-sessions</text>
  <text x="100" y="188" font-family="monospace" font-size="9" fill="#888" text-anchor="middle">Claude Code Session Manager</text>
</svg>
