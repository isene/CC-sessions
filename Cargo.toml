[package]
name = "cc-sessions"
version = "2.0.0"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "Claude Code session manager: bookmark and resume sessions with tags (cc / cl / cc-bookmark)"
license = "Unlicense"
repository = "https://github.com/isene/CC-sessions"

[dependencies]
# preserve_order: the bookmarks file's session order IS the picker
# order (J/K reorder persists) — a sorted map would scramble it.
serde_json = { version = "1", features = ["preserve_order"] }
libc = "0.2"

[[bin]]
name = "cc"
path = "src/cc.rs"

[[bin]]
name = "cl"
path = "src/cl.rs"

[[bin]]
name = "cc-bookmark"
path = "src/bookmark.rs"

[profile.release]
opt-level = 3
lto = true
